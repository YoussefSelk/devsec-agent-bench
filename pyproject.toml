[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devsec-agent-bench"
version = "0.1.0"
description = "Controlled, reproducible evaluation of security development agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.12,<1", "pydantic>=2.8,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "mcp>=1.12,<2", "SQLAlchemy>=2,<3", "pandas>=2.2,<4", "streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "pandas-stubs", "build"]

[project.scripts]
devsec-bench = "devsec_bench.cli:app"
devsec-mcp = "devsec_bench.tools.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devsec_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/devsec_bench/scenarios"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
# Follow the active interpreter; CI also checks the minimum supported Python 3.11.
strict = true
exclude = ["src/devsec_bench/scenarios/"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: exercises real local boundaries"]
