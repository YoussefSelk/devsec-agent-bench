name: Quality and offline benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.26
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest --junitxml=.bench/tests.xml
      - run: uv build
      - run: uv run --frozen devsec-bench validate
      - run: uv run --frozen devsec-bench run --agent reference --concurrency 2
      - run: uv run --frozen devsec-bench report --latest
      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/devsec-bench run --agent reference --home wheel-history
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-python-${{ matrix.python }}
          path: .bench/
          retention-days: 14
